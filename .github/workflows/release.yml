name: Release DAU Voice Pro (Windows & macOS + Auto-Update)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ensure single Draft Release exists before parallel matrix builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "DAU Voice Pro v${VERSION}" \
              --notes "$(cat <<EOF
          ## DAU Voice Pro v${VERSION}

          Bản phát hành chính thức cho **Windows (\`.exe\`/\`.msi\`)** và **macOS (\`.dmg\`)** tích hợp sẵn AI Engine (không cần cài Python).
          Người dùng đang cài đặt bản cũ chỉ cần mở app lên để **tự động cập nhật 1 chạm** (giữ nguyên toàn bộ model offline, từ điển và API Key).
          EOF
          )"
            echo "Created draft release $TAG"
          else
            echo "Draft/existing release $TAG already present"
          fi

  publish-tauri:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target_label: windows-x64
            args: ""
          - platform: macos-latest
            target_label: macos-arm64
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Setup uv (Python 3.12)
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Build & verify macOS native ScreenCaptureKit + ANE Swift helper
        if: matrix.platform == 'macos-latest'
        run: |
          bash native-macos/build.sh
          otool -l native-macos/voicerecore-macos-helper | grep -A4 LC_BUILD_VERSION
          otool -l native-macos/voicerecore-macos-helper | grep -q "minos 13.0"

      - name: Build standalone AI Engine sidecar (Windows .exe)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cd engine
          uv sync
          uv pip install --python .venv/Scripts/python.exe pyinstaller pyaudiowpatch
          uv run --no-sync python ../scripts/fetch_llama_server.py
          uv run --no-sync python build_sidecar.py

      - name: Smoke-test Windows standalone AI Engine sidecar
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          @'
          import json, os, subprocess, tempfile, time, urllib.request
          from pathlib import Path

          bin_path = Path("src-tauri/resources/engine-bin/voicerecore-engine/voicerecore-engine.exe").resolve()
          assert bin_path.exists(), f"Missing sidecar: {bin_path}"
          llama_exe = bin_path.parent / "llama" / "llama-server.exe"
          assert llama_exe.exists(), f"Missing bundled portable llama-server.exe: {llama_exe}"
          subprocess.run([str(llama_exe), "--version"], cwd=str(llama_exe.parent), check=True, timeout=20)

          sherpa_ort = bin_path.parent / "_internal" / "sherpa_onnx" / "lib" / "onnxruntime.dll"
          viet_ort = bin_path.parent / "_internal" / "vietasr" / "_native" / "onnxruntime.dll"
          root_ort = bin_path.parent / "_internal" / "onnxruntime.dll"
          assert sherpa_ort.exists(), "Missing sherpa_onnx/lib/onnxruntime.dll"
          if viet_ort.exists():
              assert sherpa_ort.stat().st_size == viet_ort.stat().st_size, "vietasr onnxruntime.dll mismatch!"
          if root_ort.exists():
              assert sherpa_ort.stat().st_size == root_ort.stat().st_size, "root onnxruntime.dll mismatch!"

          with tempfile.TemporaryDirectory(prefix="pv_win_smoke_") as td:
              env = os.environ.copy()
              env["VOICERECORE_MODEL_DIR"] = str(Path(td) / "models")
              env["VOICERECORE_CACHE_DIR"] = str(Path(td) / "cache")
              env["VOICERECORE_GLOSSARY_PATH"] = str(Path(td) / "glossary.json")
              env["VOICERECORE_LOG_DIR"] = str(Path(td) / "logs")
              proc = subprocess.Popen(
                  [str(bin_path), "--host", "127.0.0.1", "--port", "18799"],
                  cwd=str(bin_path.parent),
                  env=env,
              )
              try:
                  health = None
                  deadline = time.time() + 45.0
                  while time.time() < deadline:
                      assert proc.poll() is None, f"Windows sidecar exited early: rc={proc.returncode}"
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:18799/api/health", timeout=2.0) as r:
                              data = json.loads(r.read().decode("utf-8"))
                              if data.get("ok") and data.get("asr_loaded"):
                                  health = data
                                  break
                      except Exception:
                          pass
                      time.sleep(0.5)
                  assert health is not None, "Windows sidecar failed to load ASR within 45s"
                  assert not health.get("boot_error"), f"boot_error: {health.get('boot_error')}"
                  assert health.get("system_audio_ready"), "Expected Windows WASAPI loopback ready"
                  assert health.get("llama_server_ready"), "Expected bundled portable llama_server_ready=True"
                  print("Windows sidecar smoke OK:", health["platform"], "asr_loaded=", health["asr_loaded"], "llama_ready=", health["llama_server_ready"])
                  req = urllib.request.Request("http://127.0.0.1:18799/api/shutdown", method="POST")
                  with urllib.request.urlopen(req, timeout=5.0) as r:
                      assert r.status == 200
                  proc.wait(timeout=10.0)
              finally:
                  if proc.poll() is None:
                      proc.kill()
                      proc.wait(timeout=5.0)
          '@ | uv run --project engine --no-sync python -

      - name: Build standalone AI Engine sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cd engine
          uv sync
          uv pip install --python .venv/bin/python pyinstaller
          uv run --no-sync python ../scripts/fetch_llama_server.py
          uv run --no-sync python build_sidecar.py

      - name: Smoke-test macOS standalone AI Engine sidecar
        if: matrix.platform == 'macos-latest'
        run: |
          uv run --project engine --no-sync python - <<'PY'
          import json, os, subprocess, tempfile, time, urllib.request
          from pathlib import Path

          bin_path = Path("src-tauri/resources/engine-bin/voicerecore-engine/voicerecore-engine").resolve()
          assert bin_path.exists(), f"Missing sidecar: {bin_path}"
          llama_bin = bin_path.parent / "llama" / "llama-server"
          assert llama_bin.exists(), f"Missing bundled portable llama-server: {llama_bin}"
          subprocess.run([str(llama_bin), "--version"], cwd=str(llama_bin.parent), check=True, timeout=20)

          with tempfile.TemporaryDirectory(prefix="pv_mac_smoke_") as td:
              env = os.environ.copy()
              env["VOICERECORE_MODEL_DIR"] = str(Path(td) / "models")
              env["VOICERECORE_CACHE_DIR"] = str(Path(td) / "cache")
              env["VOICERECORE_GLOSSARY_PATH"] = str(Path(td) / "glossary.json")
              env["VOICERECORE_LOG_DIR"] = str(Path(td) / "logs")
              proc = subprocess.Popen(
                  [str(bin_path), "--host", "127.0.0.1", "--port", "18799"],
                  cwd=str(bin_path.parent),
                  env=env,
              )
              try:
                  health = None
                  deadline = time.time() + 45.0
                  while time.time() < deadline:
                      assert proc.poll() is None, f"macOS sidecar exited early: rc={proc.returncode}"
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:18799/api/health", timeout=2.0) as r:
                              data = json.loads(r.read().decode("utf-8"))
                              if data.get("ok") and data.get("asr_loaded"):
                                  health = data
                                  break
                      except Exception:
                          pass
                      time.sleep(0.5)
                  assert health is not None, "macOS sidecar failed to load ASR within 45s"
                  assert not health.get("boot_error"), f"boot_error: {health.get('boot_error')}"
                  assert health.get("mac_helper_ready"), "Expected mac_helper_ready=True"
                  assert health.get("system_audio_ready"), "Expected system_audio_ready=True"
                  assert health.get("llama_server_ready"), "Expected bundled portable llama_server_ready=True"
                  print("macOS sidecar smoke OK:", health["platform"], "asr_loaded=", health["asr_loaded"], "llama_ready=", health["llama_server_ready"])
                  req = urllib.request.Request("http://127.0.0.1:18799/api/shutdown", method="POST")
                  with urllib.request.urlopen(req, timeout=5.0) as r:
                      assert r.status == 200
                  proc.wait(timeout=10.0)
              finally:
                  if proc.poll() is None:
                      proc.kill()
                      proc.wait(timeout=5.0)
          PY

      - name: Install frontend dependencies
        run: pnpm install

      - name: Configure optional Apple Developer signing (only when secret is set)
        if: matrix.platform == 'macos-latest'
        env:
          _APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _APPLE_SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PW: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$_APPLE_CERT" ]; then
            echo "APPLE_CERTIFICATE=$_APPLE_CERT" >> "$GITHUB_ENV"
            [ -n "$_APPLE_CERT_PW" ] && echo "APPLE_CERTIFICATE_PASSWORD=$_APPLE_CERT_PW" >> "$GITHUB_ENV"
            [ -n "$_APPLE_SIGN_ID" ] && echo "APPLE_SIGNING_IDENTITY=$_APPLE_SIGN_ID" >> "$GITHUB_ENV"
            [ -n "$_APPLE_ID" ] && echo "APPLE_ID=$_APPLE_ID" >> "$GITHUB_ENV"
            [ -n "$_APPLE_PW" ] && echo "APPLE_PASSWORD=$_APPLE_PW" >> "$GITHUB_ENV"
            [ -n "$_APPLE_TEAM" ] && echo "APPLE_TEAM_ID=$_APPLE_TEAM" >> "$GITHUB_ENV"
            echo "Apple Developer signing enabled."
          else
            echo "No APPLE_CERTIFICATE secret configured; building ad-hoc signed macOS bundle."
          fi

      - name: Build & Upload Signed Installer to Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "DAU Voice Pro v__VERSION__"
          releaseBody: |
            ## DAU Voice Pro v__VERSION__

            Bản phát hành chính thức cho **Windows (`.exe`/`.msi`)** và **macOS (`.dmg`)** tích hợp sẵn AI Engine (không cần cài Python).
            Người dùng đang cài đặt bản cũ chỉ cần mở app lên để **tự động cập nhật 1 chạm** (giữ nguyên toàn bộ model offline, từ điển và API Key).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Assemble & verify canonical latest.json then publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import subprocess
          import tempfile
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          version = conf["version"]
          tag = f"v{version}"
          repo = os.environ["GITHUB_REPOSITORY"]

          rel_raw = subprocess.check_output(
              ["gh", "release", "view", tag, "--json", "assets,body,isDraft"],
              text=True,
          )
          rel = json.loads(rel_raw)
          assets = {a["name"]: a for a in rel.get("assets", [])}
          print("Release assets:", sorted(assets.keys()))

          def find_asset(suffix: str) -> dict:
              matches = [a for name, a in assets.items() if name.endswith(suffix)]
              if not matches:
                  raise SystemExit(f"Missing required release asset ending with '{suffix}'")
              return matches[0]

          def canonical_url(asset: dict) -> str:
              url = f"https://github.com/{repo}/releases/download/{tag}/{urllib.parse.quote(asset['name'])}"
              assert "/untagged-" not in url, f"Invalid draft URL: {url}"
              return url

          mac_tar = find_asset("aarch64.app.tar.gz")
          mac_sig_asset = find_asset("aarch64.app.tar.gz.sig")
          win_msi = find_asset(".msi")
          win_msi_sig_asset = find_asset(".msi.sig")
          win_nsis = find_asset("-setup.exe")
          win_nsis_sig_asset = find_asset("-setup.exe.sig")

          with tempfile.TemporaryDirectory() as td:
              td_path = Path(td)
              def fetch_sig(asset_name: str) -> str:
                  subprocess.run(
                      ["gh", "release", "download", tag, "-p", asset_name, "-D", str(td_path)],
                      check=True,
                  )
                  sig = (td_path / asset_name).read_text(encoding="utf-8").strip()
                  assert sig, f"Empty signature in {asset_name}"
                  return sig

              mac_sig = fetch_sig(mac_sig_asset["name"])
              msi_sig = fetch_sig(win_msi_sig_asset["name"])
              nsis_sig = fetch_sig(win_nsis_sig_asset["name"])

              manifest = {
                  "version": version,
                  "notes": rel.get("body") or f"DAU Voice Pro v{version}",
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z"),
                  "platforms": {
                      "darwin-aarch64": {"signature": mac_sig, "url": canonical_url(mac_tar)},
                      "darwin-aarch64-app": {"signature": mac_sig, "url": canonical_url(mac_tar)},
                      "windows-x86_64": {"signature": msi_sig, "url": canonical_url(win_msi)},
                      "windows-x86_64-msi": {"signature": msi_sig, "url": canonical_url(win_msi)},
                      "windows-x86_64-nsis": {"signature": nsis_sig, "url": canonical_url(win_nsis)},
                  },
              }
              required_keys = {
                  "darwin-aarch64",
                  "darwin-aarch64-app",
                  "windows-x86_64",
                  "windows-x86_64-msi",
                  "windows-x86_64-nsis",
              }
              assert required_keys.issubset(manifest["platforms"].keys())

              out_path = td_path / "latest.json"
              out_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
              subprocess.run(
                  ["gh", "release", "upload", tag, str(out_path), "--clobber"],
                  check=True,
              )
              subprocess.run(
                  ["gh", "release", "edit", tag, "--draft=false", "--latest"],
                  check=True,
              )
              print(f"Published {tag} with verified latest.json platforms:", sorted(manifest["platforms"].keys()))

              # Verify published latest.json endpoint resolves cleanly (retry briefly for GitHub CDN propagation)
              latest_url = f"https://github.com/{repo}/releases/latest/download/latest.json"
              last_err = None
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(latest_url, timeout=15) as resp:
                          live = json.loads(resp.read().decode("utf-8"))
                          if live.get("version") == version:
                              print(f"Verified live auto-update endpoint -> v{live['version']} OK")
                              last_err = None
                              break
                          last_err = RuntimeError(f"Live version still {live.get('version')} != {version}")
                  except Exception as exc:
                      last_err = exc
                  time.sleep(3)
              if last_err is not None:
                  raise last_err
          PY
